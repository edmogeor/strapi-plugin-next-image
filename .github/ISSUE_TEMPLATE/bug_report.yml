name: Bug Report
description: Report a problem with the plugin
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the sections below so we can reproduce and fix the issue.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I have searched [existing issues](https://github.com/edmogeor/strapi-plugin-next-image/issues) and this is not a duplicate.
          required: true
        - label: I am using a supported version of Strapi.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the behavior?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Which version of strapi-plugin-next-image are you running?
    validations:
      required: true
  - type: input
    id: strapi-version
    attributes:
      label: Strapi version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, package manager, browser, etc.
      placeholder: |
        - Node: 20.11.0
        - OS: macOS 14
        - Package manager: npm 10
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste any relevant log output or screenshots. This will be automatically formatted into code.
      render: shell
    validations:
      required: false
