name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build --workspaces

      - name: Lint
        run: npx oxlint packages/

      - name: Typecheck
        run: npm run typecheck

      - name: Validate config sync
        run: node scripts/validate-config-sync.mjs

      - name: Run tests
        run: npm run test --workspaces

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          echo "$BODY" > /tmp/release-notes.md

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for trusted publishing support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build --workspaces

      - name: Publish strapi-plugin-next-image
        run: |
          VERSION=$(node -p "require('./packages/strapi-plugin-next-image/package.json').version")
          if npm view strapi-plugin-next-image@$VERSION version 2>/dev/null; then
            echo "strapi-plugin-next-image@$VERSION already published, skipping"
          else
            npm publish --workspace=packages/strapi-plugin-next-image --access public --provenance
          fi

      - name: Publish strapi-next-image
        run: |
          VERSION=$(node -p "require('./packages/strapi-next-image/package.json').version")
          if npm view strapi-next-image@$VERSION version 2>/dev/null; then
            echo "strapi-next-image@$VERSION already published, skipping"
          else
            npm publish --workspace=packages/strapi-next-image --access public --provenance
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
          generate_release_notes: false
